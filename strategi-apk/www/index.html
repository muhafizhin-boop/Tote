<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strategi Berurutan yang Bisa Diubah</title>
<style>
:root{--bg:#eaf0f2;--panel:#fff;--ink:#12252d;--mute:#5b6f78;--line:#c9d6db;--acc:#0e6f78;--accs:#d3eceb;--warn:#a8560f;--warns:#fbe6d0;--ok:#2f7d3a;--oks:#d9efdc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--panel:#16272e;--ink:#e6eef1;--mute:#8fa5ae;--line:#2a4049;--acc:#4fc3cc;--accs:#12363b;--warn:#f0a35e;--warns:#3a2a17;--ok:#7fd08a;--oks:#173a1d}}
:root[data-theme="dark"]{--bg:#0e1a1f;--panel:#16272e;--ink:#e6eef1;--mute:#8fa5ae;--line:#2a4049;--acc:#4fc3cc;--accs:#12363b;--warn:#f0a35e;--warns:#3a2a17;--ok:#7fd08a;--oks:#173a1d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
header{grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
aside .panel{position:sticky;top:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:58px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
button:hover{border-color:var(--acc)}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#062a2d}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.steps{position:relative;display:grid;gap:14px;padding-left:34px}
.steps:before{content:"";position:absolute;left:13px;top:12px;bottom:12px;width:2px;background:var(--line)}
.step{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.step .n{position:absolute;left:-34px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600}
.step.s-jalan{border-color:var(--acc)} .step.s-jalan .n{border-color:var(--acc);background:var(--accs)}
.step.s-ok .n{border-color:var(--ok);background:var(--oks)}
.step.s-ubah{border-color:var(--warn)} .step.s-ubah .n{border-color:var(--warn);background:var(--warns)}
.step input.t{font-weight:600;background:transparent;border-color:transparent;padding:4px 6px;margin:-4px -6px 4px}
.step input.t:hover,.step input.t:focus{border-color:var(--line);background:var(--bg)}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.stat{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat button{border:0;border-radius:0;padding:5px 9px;font-size:13px;background:transparent}
.stat button.on{background:var(--acc);color:#fff}
.stat button.on.w{background:var(--warn)} .stat button.on.g{background:var(--ok)}
.rev{margin-top:10px;padding:10px;background:var(--warns);border-radius:6px;font-size:14px}
.rev b{color:var(--warn)}
.tools{display:flex;gap:4px;margin-left:auto}
.tools button{padding:3px 8px;font-size:13px}
.log{list-style:none;margin:0;padding:0;font-size:13px;color:var(--mute);max-height:150px;overflow:auto}
.log li{padding:4px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Strategi Berurutan yang Bisa Diubah</h1>
<p class="sub">Tetapkan tujuan, susun langkah, uji hasilnya. Kalau langkah belum berhasil, ubah caranya. Kalau tujuannya bergeser, ubah tujuannya. Semua bisa diedit kapan saja.</p>
</header>

<aside>
<div class="panel">
<h2>Tujuan</h2>
<label for="g-what">Apa yang ingin dicapai (kalimat positif, spesifik)</label>
<textarea id="g-what"></textarea>
<label for="g-proof">Bukti kalau sudah tercapai (yang bisa dilihat/diukur)</label>
<textarea id="g-proof"></textarea>
<label for="g-why">Alasan tujuan ini penting</label>
<textarea id="g-why"></textarea>
<div class="two">
<div><label for="g-when">Tenggat</label><input id="g-when" type="date"></div>
<div><label for="g-res">Sumber daya</label><input id="g-res" placeholder="waktu, alat, orang"></div>
</div>
<div class="row" style="margin-top:12px">
<button class="pri" id="saveGoal">Simpan perubahan tujuan</button>
</div>
<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
<h2>Progres</h2>
<div class="bar"><i id="bar"></i></div>
<div id="pTxt" class="sub" style="margin:0 0 12px"></div>
<label for="tpl">Mulai dari templat</label>
<select id="tpl"><option value="">Pilih templat…</option><option value="belajar">Belajar keahlian baru</option><option value="kebiasaan">Membangun kebiasaan</option><option value="proyek">Menyelesaikan proyek</option><option value="kosong">Kosongkan semua</option></select>
<div class="row" style="margin-top:12px"><button id="copy">Salin sebagai teks</button></div>
<h2 style="margin-top:16px">Riwayat perubahan</h2>
<ul class="log" id="log"></ul>
</div>
</aside>

<main>
<div class="row" style="margin-bottom:12px">
<h2 style="margin:0">Langkah-langkah</h2>
<button class="pri" id="add" style="margin-left:auto">Tambah langkah</button>
</div>
<div class="steps" id="steps"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
var KEY="strategi-berurutan-v1";
var TPL={
belajar:{goal:{what:"Bisa membuat presentasi 10 menit dalam bahasa Inggris tanpa membaca catatan",proof:"Merekam video presentasi dan mendapat umpan balik dari 2 orang",why:"Untuk peluang kerja dan percaya diri berbicara",when:"",res:"30 menit per hari, aplikasi rekam, 2 teman"},
steps:[["Tentukan topik dan kerangka 3 poin","Kerangka selesai di 1 halaman","Persempit topik jadi 1 ide utama"],["Tulis naskah dan hafalkan kosakata kunci","20 kata kunci bisa diucapkan tanpa lihat","Ganti dengan kartu kata harian"],["Latihan berbicara 3 kali sambil merekam","Rekaman terakhir lebih lancar dari yang pertama","Latihan per bagian, bukan sekaligus"],["Presentasi ke 2 orang dan minta umpan balik","Ada 2 catatan perbaikan konkret","Cari 1 orang lain yang lebih suportif"]]},
kebiasaan:{goal:{what:"Olahraga 20 menit, 4 kali seminggu, selama 8 minggu",proof:"Centang di kalender minimal 32 sesi",why:"Energi lebih stabil dan tidur lebih baik",when:"",res:"Sepatu, waktu pagi, teman ajakan"},
steps:[["Pilih jenis olahraga dan jadwal tetap","Jadwal tertulis di kalender","Coba jam lain di minggu berikutnya"],["Mulai versi mini: 5 menit tiap hari","7 hari berturut-turut terlaksana","Turunkan jadi 2 menit"],["Naikkan bertahap ke 20 menit","3 minggu stabil 4 kali/minggu","Tahan di durasi sebelumnya seminggu lagi"],["Pasang pengingat dan pendamping","Sesi terlewat kurang dari 2 per bulan","Ganti bentuk pengingat atau pendamping"]]},
proyek:{goal:{what:"Meluncurkan versi pertama proyek dan mendapat 10 pengguna awal",proof:"10 orang benar-benar memakai dan memberi tanggapan",why:"Membuktikan idenya layak dilanjutkan",when:"",res:"Waktu akhir pekan, anggaran kecil"},
steps:[["Tulis masalah dan calon pengguna dalam 3 kalimat","Ada 5 orang yang membenarkan masalahnya","Ubah sasaran pengguna"],["Tentukan fitur inti (maksimal 3)","Daftar fitur disetujui dan dibatasi","Kurangi lagi sampai 1 fitur"],["Bangun versi sederhana","Bisa dipakai dari awal sampai akhir","Potong bagian yang bikin macet"],["Bagikan ke 15 orang dan kumpulkan tanggapan","10 orang mencoba","Ubah cara mengajak atau tempatnya"]]}
};
var S={goal:{what:"",proof:"",why:"",when:"",res:""},steps:[],log:[]};
var $=function(i){return document.getElementById(i)};
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.goal)S=d;return}}catch(e){}
apply("belajar",true)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return "s"+Math.random().toString(36).slice(2,8)}
function stamp(){var d=new Date();return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
function log(t){S.log.unshift({t:t,at:stamp()});S.log=S.log.slice(0,40)}
function toast(m){var t=$("toast");t.textContent=m;t.className="toast show";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className="toast"},1800)}
function apply(k,quiet){
if(k==="kosong"){S.goal={what:"",proof:"",why:"",when:"",res:""};S.steps=[]}
else{var t=TPL[k];S.goal=JSON.parse(JSON.stringify(t.goal));S.steps=t.steps.map(function(s){return{id:uid(),title:s[0],test:s[1],alt:s[2],st:"belum",note:""}})}
if(!quiet)log("Memakai templat: "+k);save();render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var LBL=[["belum","Belum",""],["jalan","Berjalan",""],["ok","Berhasil","g"],["ubah","Perlu diubah","w"]];
function render(){
var g=S.goal;$("g-what").value=g.what;$("g-proof").value=g.proof;$("g-why").value=g.why;$("g-when").value=g.when;$("g-res").value=g.res;
var box=$("steps");
if(!S.steps.length){box.innerHTML='<div class="panel">Belum ada langkah. Pilih templat di samping atau tekan Tambah langkah.</div>'}
else box.innerHTML=S.steps.map(function(s,i){
var btns=LBL.map(function(l){return '<button data-a="st" data-v="'+l[0]+'" class="'+(s.st===l[0]?"on "+l[2]:"")+'">'+l[1]+'</button>'}).join("");
var rev=s.st==="ubah"?'<div class="rev"><b>Waktunya menyesuaikan.</b> Langkah ini belum lolos uji. Coba rencana cadangan di bawah, atau tulis pendekatan baru langsung di kolom judul dan cara uji, lalu ubah status ke Berjalan.<label style="margin-top:8px">Apa yang kamu pelajari dari percobaan ini?</label><textarea data-f="note">'+esc(s.note||"")+'</textarea></div>':"";
return '<section class="step s-'+s.st+'" data-id="'+s.id+'"><div class="n">'+(i+1)+'</div>'+
'<div class="row"><input class="t" data-f="title" aria-label="Judul langkah" value="'+esc(s.title)+'"><div class="tools"><button data-a="up" aria-label="Naikkan">▲</button><button data-a="dn" aria-label="Turunkan">▼</button><button data-a="del" aria-label="Hapus">Hapus</button></div></div>'+
'<div class="two"><div><label>Cara menguji (bukti langkah ini berhasil)</label><textarea data-f="test">'+esc(s.test)+'</textarea></div>'+
'<div><label>Kalau belum berhasil, ubah menjadi</label><textarea data-f="alt">'+esc(s.alt)+'</textarea></div></div>'+
'<div class="row" style="margin-top:10px"><div class="stat" role="group" aria-label="Status">'+btns+'</div></div>'+rev+'</section>'}).join("");
var done=S.steps.filter(function(s){return s.st==="ok"}).length,n=S.steps.length;
$("bar").style.width=(n?Math.round(done/n*100):0)+"%";
$("pTxt").textContent=n?done+" dari "+n+" langkah berhasil":"Belum ada langkah";
$("log").innerHTML=S.log.length?S.log.map(function(l){return "<li>"+esc(l.at)+" · "+esc(l.t)+"</li>"}).join(""):"<li>Belum ada perubahan.</li>";
}
function find(el){var c=el.closest(".step");if(!c)return null;var id=c.getAttribute("data-id");for(var i=0;i<S.steps.length;i++)if(S.steps[i].id===id)return i;return null}
$("steps").addEventListener("input",function(e){var f=e.target.getAttribute("data-f");if(!f)return;var i=find(e.target);if(i===null)return;S.steps[i][f]=e.target.value;save()});
$("steps").addEventListener("change",function(e){var f=e.target.getAttribute("data-f");if(f==="title"||f==="test"||f==="alt"){var i=find(e.target);if(i!==null){log("Mengubah "+(f==="alt"?"rencana cadangan":f==="test"?"cara uji":"judul")+" langkah "+(i+1));save();render()}}});
$("steps").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.getAttribute("data-a"),i=find(b);if(i===null)return;var s=S.steps[i];
if(a==="st"){s.st=b.getAttribute("data-v");log("Langkah "+(i+1)+": "+b.textContent)}
else if(a==="del"){if(!confirm("Hapus langkah ini?"))return;S.steps.splice(i,1);log("Menghapus langkah "+(i+1))}
else if(a==="up"&&i>0){S.steps.splice(i-1,0,S.steps.splice(i,1)[0]);log("Memindahkan langkah "+(i+1)+" ke atas")}
else if(a==="dn"&&i<S.steps.length-1){S.steps.splice(i+1,0,S.steps.splice(i,1)[0]);log("Memindahkan langkah "+(i+1)+" ke bawah")}
save();render()});
$("add").onclick=function(){S.steps.push({id:uid(),title:"Langkah baru",test:"",alt:"",st:"belum",note:""});log("Menambah langkah "+S.steps.length);save();render();toast("Langkah ditambahkan")};
$("saveGoal").onclick=function(){var n={what:$("g-what").value,proof:$("g-proof").value,why:$("g-why").value,when:$("g-when").value,res:$("g-res").value};
var ch=Object.keys(n).filter(function(k){return n[k]!==S.goal[k]});
if(!ch.length){toast("Tidak ada perubahan");return}
S.goal=n;log("Mengubah tujuan ("+ch.length+" bagian)");save();render();toast("Tujuan diperbarui. Cek apakah langkah masih sesuai.")};
$("tpl").onchange=function(e){var v=e.target.value;if(!v)return;if(!confirm("Ini akan mengganti tujuan dan langkah saat ini. Lanjutkan?")){e.target.value="";return}apply(v);e.target.value=""};
$("copy").onclick=function(){var g=S.goal,t="TUJUAN: "+g.what+"\nBukti berhasil: "+g.proof+"\nAlasan: "+g.why+"\nTenggat: "+(g.when||"-")+"\nSumber daya: "+(g.res||"-")+"\n\nLANGKAH:\n"+S.steps.map(function(s,i){return (i+1)+". "+s.title+" ["+s.st+"]\n   Uji: "+s.test+"\n   Jika gagal: "+s.alt}).join("\n");
function ok(){toast("Tersalin")}
try{navigator.clipboard.writeText(t).then(ok,function(){fb()})}catch(e){fb()}
function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("Gagal menyalin")}a.remove()}};
load();render();
})();
</script>
</body>
</html>
